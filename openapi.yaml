openapi: 3.0.0
info:
  title: Workflow Approval System API
  description: API for a SaaS platform that allows customers to manage approvals for
    generic workflows, users, and groups.
  version: 1.0.0
tags:
  - name: Authentication
    description: OIDC authentication and token management
  - name: Workflows
    description: Workflow management and approval
  - name: Workflow Templates
    description: Workflow template management
  - name: Users
    description: User management
  - name: Groups
    description: Group management
  - name: Spaces
    description: Space management
  - name: Organizations
    description: Organization entitlements and metered usage management
  - name: Workflow Actions
    description: Workflow actions and voting
  - name: Agents
    description: Agent registration and management
  - name: Roles
    description: Role template management and listing
  - name: Health
    description: Health check endpoints
  - name: Quotas
    description: System quota management
  - name: Audit Logs
    description: Endpoints related to audit logs
  - name: Resources
    description: Resolving generic resource information
