post:
  operationId: acceptInvitation
  summary: accept Invitation
  tags:
    - Organizations
  description: Authenticate the exact invited platform account, validate the token
    and current inviter authority, then admit membership atomically. Existing
    membership is not required.
  parameters:
    - name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    "200":
      description: Successful operation
      headers:
        ETag:
          description: Opaque version of the returned membership.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/Membership
    "400":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "401":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "403":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "404":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "409":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "423":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "503":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ./schemas.yaml#/InvitationAccept
