get:
  operationId: listOwnOrganizations
  summary: List organizations for the authenticated account
  description: Lists only organizations in which the authenticated account has a membership.
  tags:
    - Organizations
  parameters:
    - name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        default: 20
        maximum: 100
  responses:
    "200":
      description: Successful operation
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/OrganizationList
    "400":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "401":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "403":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "404":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "409":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "423":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "503":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
post:
  operationId: createOrganization
  summary: Create an organization
  description: Creates an organization and its initial owner membership atomically.
  tags:
    - Organizations
  parameters: []
  responses:
    "201":
      description: Successful operation
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/OrganizationCreateResponse
    "400":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "401":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "403":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "404":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "409":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "423":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "503":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ./schemas.yaml#/OrganizationCreate
