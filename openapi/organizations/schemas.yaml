PlanTier:
  type: string
  enum:
    - FREE
    - SELF_HOSTED_UNLIMITED
  description: Subscription plan tier of the organization

TierFeatures:
  type: object
  required:
    - platformLlmEvaluators
  properties:
    platformLlmEvaluators:
      type: boolean
      description: Controls access to platform-managed AI Evaluators (incurs direct compute cost)

OrganizationEntitlementsResponse:
  type: object
  required:
    - organizationId
    - planTier
    - edition
    - features
    - quotas
  properties:
    organizationId:
      type: string
      format: uuid
    planTier:
      $ref: "#/PlanTier"
    edition:
      type: string
      enum: [self_hosted, saas_cloud]
    features:
      $ref: "#/TierFeatures"
    quotas:
      type: object
      additionalProperties:
        type: integer
        nullable: true
      description: Effective resolved quota limits (null indicates unlimited)

MetricUsageItem:
  type: object
  required:
    - metric
    - limit
    - consumed
    - reserved
    - remaining
    - unit
  properties:
    metric:
      type: string
    limit:
      type: integer
      nullable: true
      description: Total limit for the period (null indicates unlimited)
    consumed:
      type: integer
      description: Settled usage consumed so far in the period
    reserved:
      type: integer
      description: Inflight reserved capacity currently held
    remaining:
      type: integer
      nullable: true
      description: Available capacity remaining (null if unlimited)
    unit:
      type: string
      enum: [tokens, evaluations, credits, count]

OrganizationUsageResponse:
  type: object
  required:
    - organizationId
    - period
    - periodStartsAt
    - periodEndsAt
    - metrics
  properties:
    organizationId:
      type: string
      format: uuid
    period:
      type: string
      example: "2026-08"
      description: Calendar month (YYYY-MM) or active billing cycle identifier
    periodStartsAt:
      type: string
      format: date-time
      example: "2026-08-01T00:00:00Z"
      description: Start timestamp of the active billing cycle
    periodEndsAt:
      type: string
      format: date-time
      example: "2026-08-31T23:59:59Z"
      description: End timestamp of the active billing cycle
    metrics:
      type: array
      items:
        $ref: "#/MetricUsageItem"
OrganizationSummary:
  type: object
  additionalProperties: false
  required:
    - id
    - slug
    - displayName
    - status
  properties:
    id:
      type: string
      format: uuid
    slug:
      type: string
      minLength: 3
      maxLength: 63
      pattern: ^[a-z0-9](?:[a-z0-9-]{1,61}[a-z0-9])$
      description: Immutable readable identifier; API addressing uses the opaque id.
    displayName:
      type: string
      minLength: 1
    status:
      type: string
      enum:
        - active
        - suspended
        - deleting
        - deleted
Membership:
  type: object
  additionalProperties: false
  required:
    - id
    - organizationId
    - accountId
    - displayName
    - status
    - orgRole
  properties:
    id:
      type: string
      format: uuid
    organizationId:
      type: string
      format: uuid
    accountId:
      type: string
      format: uuid
    displayName:
      type: string
      minLength: 1
    status:
      type: string
      enum:
        - active
        - removed
    orgRole:
      type: string
      enum:
        - owner
        - admin
        - member
OrganizationCreate:
  type: object
  additionalProperties: false
  required:
    - slug
    - displayName
  properties:
    slug:
      type: string
      minLength: 3
      maxLength: 63
      pattern: ^[a-z0-9](?:[a-z0-9-]{1,61}[a-z0-9])$
    displayName:
      type: string
      minLength: 1
OrganizationUpdate:
  type: object
  additionalProperties: false
  required:
    - displayName
  properties:
    displayName:
      type: string
      minLength: 1
OrganizationCreateResponse:
  type: object
  additionalProperties: false
  required:
    - organization
    - owner
  properties:
    organization:
      $ref: "#/OrganizationSummary"
    owner:
      $ref: "#/Membership"
MembershipRoleUpdate:
  type: object
  additionalProperties: false
  required:
    - orgRole
  properties:
    orgRole:
      type: string
      enum:
        - owner
        - admin
        - member
InvitationCreate:
  type: object
  additionalProperties: false
  required:
    - accountId
    - orgRole
  properties:
    accountId:
      type: string
      format: uuid
    orgRole:
      type: string
      enum:
        - owner
        - admin
        - member
InvitationCreated:
  type: object
  additionalProperties: false
  required:
    - id
    - expiresAt
    - token
  properties:
    id:
      type: string
      format: uuid
    expiresAt:
      type: string
      format: date-time
    token:
      type: string
      minLength: 1
InvitationAccept:
  type: object
  additionalProperties: false
  required:
    - token
  properties:
    token:
      type: string
      minLength: 1
OrganizationList:
  type: object
  additionalProperties: false
  required:
    - items
    - total
    - page
    - limit
  properties:
    items:
      type: array
      items:
        $ref: "#/OrganizationSummary"
    total:
      type: integer
      minimum: 0
    page:
      type: integer
      minimum: 1
    limit:
      type: integer
      minimum: 1
      maximum: 100
MembershipList:
  type: object
  additionalProperties: false
  required:
    - items
    - total
    - page
    - limit
  properties:
    items:
      type: array
      items:
        $ref: "#/Membership"
    total:
      type: integer
      minimum: 0
    page:
      type: integer
      minimum: 1
    limit:
      type: integer
      minimum: 1
      maximum: 100
