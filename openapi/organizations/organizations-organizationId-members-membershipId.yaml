patch:
  operationId: changeMemberRole
  summary: Change a member's organization role
  description: Changes the local owner, admin, or member role when the body’s membership version is current. The server locks the organization and membership while preserving the last-owner invariant.
  tags:
    - Organizations
  parameters:
    - name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: ../shared/parameters.yaml#/IfMatch
  responses:
    "200":
      description: Successful operation
      headers:
        ETag:
          description: Opaque version of the returned membership.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/Membership
    "400":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "401":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "403":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "404":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "412":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "423":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "503":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ./schemas.yaml#/MembershipRoleUpdate
delete:
  operationId: removeMember
  summary: Remove an organization member
  description: Revokes the member's organization access when the body’s membership version is current, while retaining historical attribution.
  tags:
    - Organizations
  parameters:
    - name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: ../shared/parameters.yaml#/IfMatch
  responses:
    "204":
      description: Successful operation
    "400":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "401":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "403":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "404":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "412":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "423":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "503":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
