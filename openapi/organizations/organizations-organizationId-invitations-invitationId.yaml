delete:
  operationId: revokeInvitation
  summary: Revoke an invitation
  description: Revokes an unused organization invitation.
  tags:
    - Organizations
  parameters:
    - name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    "204":
      description: Successful operation
    "400":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "401":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "403":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "404":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "409":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "423":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "503":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
