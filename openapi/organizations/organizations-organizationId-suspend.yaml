post:
  operationId: suspendOrganization
  summary: Suspend an organization
  description: Suspends tenant resource operations using an authorized lifecycle transition.
  tags:
    - Organizations
  parameters:
    - name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: ../shared/parameters.yaml#/IfMatch
  responses:
    "200":
      description: Successful operation
      headers:
        ETag:
          description: Opaque version of the returned organization.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/OrganizationSummary
    "400":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "401":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "403":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "404":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "412":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "423":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "503":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
