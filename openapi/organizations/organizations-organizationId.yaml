get:
  operationId: getOrganization
  summary: Get an organization
  description: Returns organization metadata visible to a current member.
  tags:
    - Organizations
  parameters:
    - name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    "200":
      description: Successful operation
      headers:
        ETag:
          description: Opaque version of the returned organization.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/OrganizationSummary
    "400":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "401":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "403":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "404":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "409":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "423":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "503":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
patch:
  operationId: updateOrganization
  summary: Update an organization
  description: Updates mutable organization metadata.
  tags:
    - Organizations
  parameters:
    - name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: ../shared/parameters.yaml#/IfMatch
  responses:
    "200":
      description: Successful operation
      headers:
        ETag:
          description: Opaque version of the returned organization.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/OrganizationSummary
    "400":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "401":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "403":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "404":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "412":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "423":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "503":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ./schemas.yaml#/OrganizationUpdate
delete:
  operationId: deleteOrganization
  summary: Request organization deletion
  description: Starts asynchronous organization deletion after validating owner authority.
  tags:
    - Organizations
  parameters:
    - name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: ../shared/parameters.yaml#/IfMatch
  responses:
    "202":
      description: Successful operation
      headers:
        ETag:
          description: Opaque version of the returned organization.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/OrganizationSummary
    "400":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "401":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "403":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "404":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "412":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "423":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
    "503":
      $ref: ../shared/organization-responses.yaml#/BoundaryError
