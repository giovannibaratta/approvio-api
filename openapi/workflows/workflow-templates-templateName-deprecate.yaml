parameters:
  - $ref: ../shared/parameters.yaml#/OrganizationId
post:
  summary: Deprecate a workflow template
  description: Marks a workflow template as deprecated with optional workflow cancellation
  operationId: deprecateWorkflowTemplate
  tags:
    - Workflow Templates
  parameters:
    - name: templateIdentifier
      in: path
      required: true
      description: The name or ID of the workflow template to deprecate
      schema:
        type: string
        minLength: 1
  requestBody:
    description: Options for deprecating a workflow template.
    required: false
    content:
      application/json:
        schema:
          $ref: ./schemas.yaml#/WorkflowTemplateDeprecate
  responses:
    "409":
      $ref: ../shared/organization-responses.yaml#/ContextChanged
    "423":
      $ref: ../shared/organization-responses.yaml#/Suspended
    "200":
      description: Workflow template deprecated successfully
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/WorkflowTemplate
    "401":
      $ref: ../shared/responses.yaml#/Unauthorized
    "404":
      $ref: ../shared/responses.yaml#/NotFound
