UserSummary:
  type: object
  required:
    - orgRole
    - organizationId
    - id
    - displayName
    - accountId
  properties:
    orgRole:
      type: string
      enum: [owner, admin, member]
    organizationId:
      type: string
      format: uuid
    id:
      type: string
      format: uuid
      description: Organization-local membership identifier, retained if the account is removed and later readmitted.
      readOnly: true
      example: a1b2c3d4-e5f6-7890-1234-567890abcdef
    displayName:
      type: string
      description: User's display name.
      example: Alex Chen
    accountId:
      type: string
      format: uuid
      description: Platform account identifier linked to this local membership; it is not a source of tenant authority.
User:
  type: object
  required:
    - organizationId
    - id
    - displayName
    - accountId
    - orgRole
    - createdAt
    - groups
    - roles
  properties:
    organizationId:
      type: string
      format: uuid
    id:
      type: string
      format: uuid
      description: Organization-local membership identifier, retained if the account is removed and later readmitted.
      readOnly: true
      example: a1b2c3d4-e5f6-7890-1234-567890abcdef
    displayName:
      type: string
      description: User's display name.
      example: Alex Chen
    accountId:
      type: string
      format: uuid
      description: Platform account identifier linked to this local membership; it is not a source of tenant authority.
    orgRole:
      type: string
      enum:
        - owner
        - admin
        - member
      description: Role assigned to the user within the organization.
      example: member
    groups:
      type: array
      items:
        $ref: ../groups/schemas.yaml#/GroupInfo
    roles:
      type: array
      items:
        $ref: ../roles/schemas.yaml#/RoleOperationItem
    createdAt:
      type: string
      format: date-time
      description: Timestamp when the user was created.
      readOnly: true
      example: "2025-04-15T12:05:00Z"
ListUsersParams:
  type: object
  properties:
    page:
      type: integer
      default: 1
      description: Page number for pagination (1-indexed)
    limit:
      type: integer
      default: 20
      description: Number of results per page
    search:
      type: string
      description: Fuzzy display-name search, or an exact case-insensitive email match among members of the selected organization. Email input never searches globally.
