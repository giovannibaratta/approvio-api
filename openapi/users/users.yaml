parameters:
  - $ref: ../shared/parameters.yaml#/OrganizationId
get:
  summary: List users
  description: Returns a list of users
  operationId: listUsers
  tags:
    - Users
  parameters:
    - name: params
      in: query
      style: form
      explode: true
      schema:
        $ref: ./schemas.yaml#/ListUsersParams
  responses:
    "409":
      $ref: ../shared/organization-responses.yaml#/ContextChanged
    "423":
      $ref: ../shared/organization-responses.yaml#/Suspended
    "200":
      description: List of users
      content:
        application/json:
          schema:
            type: object
            required:
              - users
              - pagination
            properties:
              users:
                type: array
                items:
                  $ref: ./schemas.yaml#/UserSummary
              pagination:
                $ref: ../shared/schemas.yaml#/Pagination
    "401":
      $ref: ../shared/responses.yaml#/Unauthorized
