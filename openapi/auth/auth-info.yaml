parameters:
  - $ref: ../shared/parameters.yaml#/OrganizationId
get:
  summary: Get authenticated entity information
  description: Returns basic information about the authenticated entity
  operationId: getEntityInfo
  tags:
    - Authentication
  responses:
    "409":
      $ref: ../shared/organization-responses.yaml#/ContextChanged
    "423":
      $ref: ../shared/organization-responses.yaml#/Suspended
    "200":
      description: Entity information retrieved successfully
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/GetEntityInfo200Response
    "401":
      $ref: ../shared/responses.yaml#/Unauthorized
